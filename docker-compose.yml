services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microbe-movie-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      NODE_ENV: production
    ports:
      - '8080:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microbe-movie-network

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service
    environment:
      USER_PORT: 8083
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-auth_db}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microbe-movie-network

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    environment:
      AUTH_PORT: 8082
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-auth_db}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: 24h
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microbe-movie-network

  videos-service:
    build:
      context: .
      dockerfile: apps/videos-service/Dockerfile
    container_name: videos-service
    environment:
      VIDEOS_PORT: 8081
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${videos_db}
      MONGOUSER: ${MONGO_USER:-admin}
      MONGOPASSWORD: ${MONGO_PASSWORD:-password}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microbe-movie-network

volumes:
  rabbitmq_data:

networks:
  microbe-movie-network:
    driver: bridge
